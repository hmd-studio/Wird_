<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#040303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wird">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Wird - Ultra Premium Islamic Dhikr Counter. Offline, ad-free, haptic-enabled.">
<meta name="application-name" content="Wird">
<title>Wird — Premium Dhikr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#040303;
  --bg-grad:radial-gradient(ellipse at 50% 20%, #0d0b08 0%, #060504 50%, #020202 100%);
  --gold:#C6A962;
  --gold-l:#E2C97E;
  --gold-d:rgba(198,169,98,0.45);
  --gold-g:rgba(198,169,98,0.12);
  --gold-b:rgba(198,169,98,0.55);
  --w1:rgba(245,240,232,0.98);
  --w2:rgba(245,240,232,0.55);
  --w3:rgba(245,240,232,0.18);
  --w4:rgba(245,240,232,0.08);
  --red:rgba(220,80,70,0.7);
  --grn:rgba(100,190,140,0.7);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none}
html,body{
  height:100%;overflow:hidden;
  background:var(--bg);color:var(--w1);
  font-family:-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  touch-action:manipulation;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body{background:var(--bg-grad);}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:0.01ms!important;
  }
}
:focus-visible { outline: 2px solid var(--gold-d); outline-offset: 4px; border-radius: 4px; }
.app{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:100dvh;position:relative;
  padding:var(--sat) 20px var(--sab);
  z-index:1;
}
.hdr{
  position:absolute;
  top:max(var(--sat),16px);
  left:max(var(--sal),20px);
  right:max(var(--sar),20px);
  display:flex;justify-content:space-between;align-items:flex-start;
  transition:opacity 0.6s ease;
}
.hdr-l,.hdr-r{display:flex;flex-direction:column;gap:4px}
.hdr-r{align-items:flex-end}
.sk{font-size:0.7rem;color:var(--gold-d);letter-spacing:1.5px;font-weight:500;}
.dy{font-size:0.6rem;color:var(--grn);letter-spacing:1px;font-weight:400;opacity:0;transition:opacity 0.5s ease;}
.dy.show{opacity:1}
.ss{font-size:0.7rem;color:var(--w2);letter-spacing:1px;font-weight:400;font-variant-numeric:tabular-nums;transition:color 0.3s ease;}
.ss.active{color:var(--gold-d)}
.lt{font-size:0.65rem;color:var(--w2);letter-spacing:1px;font-weight:400;font-variant-numeric:tabular-nums;}
.dots{display:flex;gap:4px;margin-bottom:16px;transition:opacity 0.6s ease;}
.dots i{
  display:block;width:6px;height:6px;
  padding:10px;margin:-10px; /* Enhanced touch target visually same */
  background-clip:content-box;
  border-radius:50%;background-color:var(--w3);
  transition:all 0.4s cubic-bezier(0.22,1,0.36,1);
}
.dots i.on{background-color:var(--gold-d);width:18px;border-radius:3px;}
.ar{
  font-size:clamp(1.6rem,6vw,2.4rem);
  color:rgba(210,180,110,0.95);
  letter-spacing:1px;font-weight:400;
  direction:rtl;text-align:center;line-height:1.6;
  font-family:'Amiri Quran','Noto Naskh Arabic','KFGQPC Uthman Taha Naskh','Scheherazade New','Amiri',serif;
  text-shadow:0 2px 12px rgba(198,169,98,0.25);
  transition:opacity 0.6s ease;
}
.ar-sub{font-size:0.65rem;color:var(--w2);letter-spacing:3px;text-transform:uppercase;font-weight:400;margin-top:6px;margin-bottom:8px;transition:opacity 0.6s ease;}
.hadith{font-size:0.65rem;color:rgba(245,240,232,0.5);letter-spacing:0.5px;font-weight:300;text-align:center;max-width:320px;line-height:1.5;margin-bottom:16px;transition:opacity 0.8s ease;min-height:1.2em;}
.rw{position:relative;width:min(72vw,300px);height:min(72vw,300px);display:flex;align-items:center;justify-content:center;transition:opacity 0.8s ease;}
.rw::before{content:'';position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,var(--gold-g) 0%,transparent 65%);animation:breathe 5s ease-in-out infinite;pointer-events:none;}
@keyframes breathe{0%,100%{opacity:0.3;transform:scale(0.97)} 50%{opacity:0.7;transform:scale(1.03)}}
.rw::after{content:'';position:absolute;inset:5%;border-radius:50%;background:radial-gradient(circle,rgba(198,169,98,0.06) 0%,transparent 55%);opacity:0;pointer-events:none;transition:opacity 0.5s ease;}
.rw.golden::after{animation:goldenPulse 2s ease-in-out infinite;}
@keyframes goldenPulse{0%,100%{opacity:0.3;transform:scale(0.95)} 50%{opacity:0.8;transform:scale(1.05)}}
.rsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.rsvg circle{fill:none;cx:100;cy:100}
.r-bg{r:88;stroke:var(--w3);stroke-width:0.8}
.r-fg{r:88;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:552.92;stroke-dashoffset:552.92;transition:stroke-dashoffset 0.5s cubic-bezier(0.22,1,0.36,1);filter:drop-shadow(0 0 8px var(--gold-g));}
.r-fg.glow{stroke-width:2.2;filter:drop-shadow(0 0 16px var(--gold-b));}
.r-fg.over{stroke:var(--gold-l);stroke-width:2.8;filter:drop-shadow(0 0 24px var(--gold-b));}
.ms{r:3;fill:var(--w3);transition:all 0.4s ease}
.ms.lit{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold-d))}
.cw{text-align:center;z-index:2}
.ct{font-size:clamp(3.5rem,15vw,6rem);font-weight:300;letter-spacing:-2px;line-height:1;color:var(--w1);font-variant-numeric:tabular-nums;transition:transform 0.12s cubic-bezier(0.22,1,0.36,1);}
.ct.pop{transform:scale(1.06)}
.ct.invite{animation:invitePulse 2.5s ease-in-out infinite;}
@keyframes invitePulse{0%,100%{opacity:0.4;transform:scale(0.97)} 50%{opacity:0.9;transform:scale(1.02)}}
.gl{font-size:0.75rem;color:rgba(245,240,232,0.5);font-weight:400;letter-spacing:2px;margin-top:8px;}
.gb{font-size:0.55rem;color:var(--gold);letter-spacing:3px;margin-top:6px;opacity:0;transition:opacity 0.6s ease;}
.gb.show{opacity:1}
.hint{position:absolute;bottom:max(calc(var(--sab) + 75px),95px);font-size:0.6rem;color:rgba(245,240,232,0.3);letter-spacing:3px;text-transform:uppercase;font-weight:400;transition:opacity 1.5s ease;}
.nav{position:absolute;bottom:max(var(--sab),14px);display:flex;gap:0;align-items:center;transition:opacity 0.6s ease;}
.nav button{background:none;border:none;color:var(--w2);font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;font-weight:400;padding:14px 20px;min-width:44px;min-height:44px;cursor:pointer;font-family:inherit;transition:color 0.2s ease;}
.nav button:active{color:var(--gold-d)}
.nav .sp{width:1px;height:16px;background:var(--w3)}

.app.zen .hdr, .app.zen .dots, .app.zen .ar, .app.zen .ar-sub, .app.zen .hadith, .app.zen .hint, .app.zen .nav { opacity: 0 !important; pointer-events: none; }

.rip{position:fixed;border-radius:50%;background:radial-gradient(circle,var(--gold-g) 0%,transparent 70%);transform:scale(0);animation:ripA 0.7s ease-out forwards;pointer-events:none;z-index:2;}
@keyframes ripA{to{transform:scale(4);opacity:0}}
.glow-b{position:fixed;border-radius:50%;pointer-events:none;z-index:55;background:radial-gradient(circle,rgba(198,169,98,0.1) 0%,transparent 60%);animation:glowA 1.2s ease-out forwards;}
@keyframes glowA{0%{transform:scale(0.5);opacity:0.9} 100%{transform:scale(3.5);opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(circle at 50% 45%,var(--gold-g) 0%,transparent 55%);opacity:0;transition:opacity 0.6s ease;}
.flash.on{opacity:1}

.ov{position:fixed;inset:0;background:#040303 !important;z-index:99999;display:flex;flex-direction:column;align-items:center;padding:48px 20px 32px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity 0.3s ease,transform 0.3s ease;}
.ov::before{content:'';position:fixed;inset:-50px;background:#040303;z-index:-1;}
.ov.on{opacity:1;pointer-events:auto;transform:translateY(0)}
.ov h3{font-size:0.7rem;color:var(--w2);font-weight:400;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;margin-top:10px;position:relative;z-index:1;}
.ov .x{position:absolute;top:max(var(--sat),16px);right:20px;background:none;border:none;color:var(--w2);font-size:0.9rem;letter-spacing:2px;cursor:pointer;font-family:inherit;padding:10px;min-width:44px;min-height:44px;z-index:2;}
.sr{display:flex;justify-content:space-between;width:100%;max-width:320px;padding:12px 0;border-bottom:1px solid var(--w4);}
.sr .l{font-size:0.75rem;color:var(--w2);font-weight:400}
.sr .v{font-size:0.8rem;color:var(--gold-d);font-weight:500;font-variant-numeric:tabular-nums;}
.ss-sec{margin-top:20px;width:100%;max-width:320px}
.ss-sec h4{font-size:0.58rem;color:var(--w3);letter-spacing:2px;text-transform:uppercase;font-weight:500;margin-bottom:10px;}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:280px;margin-bottom:4px;}
.cal-hdr span{font-size:0.5rem;color:rgba(245,240,232,0.3);text-align:center;letter-spacing:1px;font-weight:400;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:280px;margin-bottom:16px;}
.cd{aspect-ratio:1;border-radius:3px;background:var(--w4);transition:background 0.3s ease;}
.cd.a{background:var(--gold-d)}
.cd.c{background:var(--gold)}
.cd.t{outline:1px solid var(--gold-d);outline-offset:2px}
.cd.empty{background:transparent}
.wk-bar{display:flex;align-items:flex-end;gap:10px;height:65px;width:100%;max-width:280px;margin:10px 0 16px;}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.wk-fill{width:100%;border-radius:3px 3px 0 0;background:var(--gold-d);transition:height 0.4s ease;min-height:3px;}
.wk-fill.cur{background:var(--gold)}
.wk-lbl{font-size:0.48rem;color:rgba(245,240,232,0.35);letter-spacing:0.5px;}
.setr{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:320px;padding:14px 0;border-bottom:1px solid var(--w4);}
.setr .l{font-size:0.75rem;color:var(--w2);font-weight:400}
.setr .sub{font-size:0.52rem;color:rgba(245,240,232,0.3);font-weight:300;margin-top:3px;}
.tg{width:44px;height:24px;border-radius:12px;background:var(--w3);position:relative;cursor:pointer;border:none;transition:background 0.3s ease;flex-shrink:0;}
.tg.on{background:var(--gold-d)}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--w2);transition:all 0.3s ease;}
.tg.on::after{left:22px;background:var(--gold)}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.pills button{background:var(--w4);border:1px solid var(--w3);color:var(--w2);padding:10px 14px;border-radius:8px;font-size:0.75rem;cursor:pointer;font-family:inherit;transition:all 0.2s ease;}
.pills button:active,.pills button.sel{border-color:var(--gold-d);color:var(--gold);background:var(--gold-g);}
.abtn{margin-top:12px;background:none;border:1px solid var(--w3);color:rgba(245,240,232,0.4);padding:12px 18px;border-radius:8px;font-size:0.65rem;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:all 0.2s ease;width:100%;max-width:320px;text-align:center;}
.abtn:active{border-color:var(--gold-d);color:var(--gold)}
.abtn.danger{border-color:rgba(220,80,70,0.2);color:var(--red)}
.abtn.share{border-color:var(--gold-d);color:var(--gold);margin-top:20px;}
.abtn.share:active{background:var(--gold-g)}
.rst{position:fixed;inset:0;background:rgba(2,2,2,0.98);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none;transition:opacity 0.3s ease;}
.rst.on{opacity:1;pointer-events:auto}
.rst p{font-size:0.85rem;color:var(--w2);font-weight:400;letter-spacing:1px;text-align:center;}
.rst .btns{display:flex;gap:16px}
.rst button{padding:12px 24px;border-radius:8px;font-size:0.7rem;letter-spacing:2px;cursor:pointer;font-family:inherit;border:1px solid var(--w3);background:none;color:var(--w2);transition:all 0.2s ease;}
.rst .cfm{border-color:rgba(220,80,70,0.35);color:var(--red)}
.rst .cfm:active{background:rgba(220,80,70,0.15)}
#impF{display:none}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(198,169,98,0.25);color:var(--gold);padding:10px 24px;border-radius:25px;font-size:0.7rem;letter-spacing:1px;opacity:0;transition:opacity 0.3s ease;pointer-events:none;z-index:999999;white-space:nowrap;}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app" id="app" role="application" aria-label="Wird Dhikr Counter">
  <div class="hdr" id="hdr">
    <div class="hdr-l">
      <div class="sk" id="sk" aria-label="Streak"></div>
      <div class="dy" id="dy" role="status">ALL GOALS ✓</div>
    </div>
    <div class="hdr-r">
      <div class="ss" id="ss" aria-label="Time spent"></div>
      <div class="lt" id="lt" aria-label="Lifetime count"></div>
    </div>
  </div>

  <div class="dots" id="dots" role="tablist" aria-label="Dhikr Selection"></div>
  
  <div class="ar" id="ar" lang="ar" role="heading" aria-level="1"></div>
  <div class="ar-sub" id="arsub" aria-hidden="true"></div>
  <div class="hadith" id="hadith" aria-live="polite"></div>

  <div class="rw" id="rw">
    <svg class="rsvg" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="r-bg"/>
      <circle class="r-fg" id="rfg"/>
      <circle class="ms" id="m1" cx="188" cy="100"/>
      <circle class="ms" id="m2" cx="100" cy="188"/>
      <circle class="ms" id="m3" cx="12" cy="100"/>
    </svg>
    <div class="cw">
      <div class="ct" id="ct" role="status" aria-live="polite" aria-label="Current count">0</div>
      <div class="gl" id="gl" aria-hidden="true">/ 100</div>
      <div class="gb" id="gb" role="alert">✓ GOAL REACHED</div>
    </div>
  </div>

  <div class="hint" id="hint" aria-hidden="true">tap anywhere</div>

  <div class="nav" id="nav">
    <button id="bp" aria-label="Previous Dhikr">◂</button><div class="sp"></div>
    <button id="bs">STATS</button><div class="sp"></div>
    <button id="bt">SETTINGS</button><div class="sp"></div>
    <button id="bn" aria-label="Next Dhikr">▸</button>
  </div>
</div>

<div class="ov" id="ovS" role="dialog" aria-label="Statistics">
  <button class="x" id="xS" aria-label="Close Statistics">✕</button>
  <h3>Statistics</h3>
  <div id="sc"></div>
</div>

<div class="ov" id="ovT" role="dialog" aria-label="Settings">
  <button class="x" id="xT" aria-label="Close Settings">✕</button>
  <h3>Settings</h3>
  <div id="tc"></div>
</div>

<div class="rst" id="ovR" role="dialog" aria-label="Reset Confirmation">
  <p>Reset current counter?<br><span style="font-size:0.6rem;color:var(--w3)">(Daily stats & history will be kept safe)</span></p>
  <div class="btns">
    <button id="rc">CANCEL</button>
    <button class="cfm" id="ry">RESET</button>
  </div>
</div>

<div class="flash" id="fl"></div>
<div class="toast" id="toast" role="alert"></div>
<input type="file" id="impF" accept=".json" aria-hidden="true">

<script>
(function(){
'use strict';

/* CORRECTED ARABIC TEXT & AUTHENTIC HADITH REFERENCES */
var D = [
  {a:'أَسْتَغْفِرُ ٱللَّهَ', e:'Astaghfirullah', g:100, h:'The Prophet ﷺ sought forgiveness 100x daily (Muslim 2702)'},
  {a:'سُبْحَانَ اللَّهِ', e:'SubhanAllah', g:33, h:'33x after salah — part of Tasbeeh Fatimah (Bukhari 6329)'},
  {a:'الْحَمْدُ لِلَّهِ', e:'Alhamdulillah', g:33, h:'33x after salah — part of Tasbeeh Fatimah (Bukhari 6329)'},
  {a:'اللَّهُ أَكْبَرُ', e:'Allahu Akbar', g:34, h:'34x after salah — completes Tasbeeh Fatimah (Bukhari 6329)'}, /* FIXED: 34x */
  {a:'لَا إِلَهَ إِلَّا اللَّهُ', e:'La ilaha illallah', g:100, h:'The best dhikr is La ilaha illallah — renews faith (Tirmidhi 3383)'}
];

var CONFIG = {
  CIRC: 2 * Math.PI * 88,
  GOALS: [33, 100, 500, 1000, 5000, 7000, 10000],
  SESSION_MS: 5000,
  MAX_RIPPLES: 5,
  LONG_PRESS_MS: 1000,
  VERSION: 2
};

var K = function(k){return 'wird_v8_'+k;};

function getDayKey(dateObj) {
  var d = dateObj || new Date();
  var rh = S ? (S.rh || 4) : 4;
  var adj = new Date(d.getTime() - rh * 36e5);
  return adj.toISOString().slice(0,10);
}

function getYesterdayKey(todayKey) {
  var d = new Date(todayKey);
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

function def(){
  return {
    _v: CONFIG.VERSION,
    d:0, c:{}, g:{}, lt:{}, h:{}, ht:{}, tt:{},
    tToday:0, sk:0, ld:'', snd:false, vib:true, wk:true, rh:4, ms:{}, wood:false
  };
}

function load(){
  try {
    var raw = localStorage.getItem(K('s'));
    if(!raw) return def();
    var s = JSON.parse(raw);
    if(!s || typeof s !== 'object' || !s.c || typeof s.c !== 'object') return def();
    if(!s.h) s.h = {}; if(!s.ht) s.ht = {}; if(!s.lt) s.lt = {};
    return s;
  } catch(e) { return def(); }
}

function save(){
  try { localStorage.setItem(K('s'), JSON.stringify(S)); } catch(e) {}
}

var S = load();

/* INITIALIZE DATA SAFELY */
D.forEach(function(_,i){
  if(typeof S.c[i]!=='number' || S.c[i]<0) S.c[i]=0;
  if(typeof S.g[i]!=='number' || S.g[i]<1) S.g[i]=D[i].g;
  if(typeof S.lt[i]!=='number' || S.lt[i]<0) S.lt[i]=0;
  if(!S.ms) S.ms={}; if(typeof S.ms[i]!=='number') S.ms[i]=0;
  if(!S.tt) S.tt={}; if(typeof S.tt[i]!=='number') S.tt[i]=0;
});
if(typeof S.rh!=='number') S.rh=4;
if(typeof S.sk!=='number') S.sk=0;
if(typeof S.tToday!=='number') S.tToday=0;

var goalHit = {};

/* FIXED: Roll Date Logic (Keeps long-term goals intact) */
function rollDate(){
  var t = getDayKey();
  if(!S.ld) S.ld = t;
  if(!S.h[t]) S.h[t] = {};
  
  if(S.ld !== t) {
    var yesterday = getYesterdayKey(t);
    var yestData = S.h[yesterday];
    var hadActivityYest = yestData && Object.keys(yestData).some(function(k){ return yestData[k] > 0; });
    
    // Strict streak calculation
    if(hadActivityYest && (S.ld === yesterday)) {
      S.sk++;
    } else {
      var diffDays = Math.round((new Date(t) - new Date(S.ld)) / 864e5);
      if(diffDays === 1 && hadActivityYest) S.sk++; // fallback edge case
      else S.sk = 0;
    }
    
    // NOTE: S.c is NOT reset here so users can achieve multi-day goals.
    S.ld = t;
    S.tToday = 0; // Reset active time for the new day
    D.forEach(function(_,i){ S.ms[i]=0; });
    goalHit = {};
    save();
  }
}
rollDate();

var $ = function(id){return document.getElementById(id);};
var E = {
  app:$('app'), ct:$('ct'), gl:$('gl'), gb:$('gb'),
  rfg:$('rfg'), ar:$('ar'), arsub:$('arsub'), hadith:$('hadith'),
  sk:$('sk'), lt:$('lt'), ss:$('ss'), dy:$('dy'), dots:$('dots'),

/* DOM INITIALIZATION */
function initDots() {
  E.dots.innerHTML = '';
  D.forEach(function(_, i) {
    var d = document.createElement('i');
    d.setAttribute('role', 'tab');
    d.setAttribute('aria-label', D[i].e);
    E.dots.appendChild(d);
  });
}

function fmt(n){
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e4) return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString('en');
}

function fmtTime(sec){
  if(!sec||sec<1) return '0s';
  var h = Math.floor(sec/3600);
  var m = Math.floor((sec%3600)/60);
  var s = sec%60;
  if(h>0) return h+'h '+m+'m';
  if(m>0) return m+'m '+s+'s';
  return s+'s';
}

function showToast(msg){
  E.toast.textContent = msg;
  E.toast.classList.add('show');
  setTimeout(function(){E.toast.classList.remove('show');}, 2500);
}

function render(){
  var i = S.d;
  var c = S.c[i] || 0;
  var g = S.g[i] || 100;
  var p = Math.min(c/g, 1);
  var over = c > g;

  E.ct.textContent = fmt(c);
  E.gl.textContent = '/ ' + fmt(g);

  if(over){
    E.rfg.style.strokeDashoffset = '0';
    E.rfg.classList.add('over');
    E.rfg.classList.remove('glow');
  }else{
    E.rfg.style.strokeDashoffset = CONFIG.CIRC - (CONFIG.CIRC * p);
    E.rfg.classList.remove('over');
    E.rfg.classList.toggle('glow', c>=g && c>0);
  }

  E.ar.textContent = D[i].a;
  E.arsub.textContent = D[i].e;
  E.hadith.textContent = D[i].h;

  E.gb.classList.toggle('show', c>=g && c>0);

  var ms = S.ms[i] || 0;
  E.m1.classList.toggle('lit', ms>=1 || p>=0.25);
  E.m2.classList.toggle('lit', ms>=2 || p>=0.50);
  E.m3.classList.toggle('lit', ms>=3 || p>=0.75);

  var sk = S.sk;
  var todayKey = getDayKey();
  var anyToday = S.h[todayKey] && Object.values(S.h[todayKey]).some(function(v){ return v>0; });
  if(anyToday && sk===0) sk=1;
  
  E.sk.textContent = sk>0 ? '\u25CF '+sk+'d' : '';
  E.sk.style.color = sk>0 ? 'var(--gold-d)' : 'transparent';

  E.lt.textContent = '\u221E ' + fmt(S.lt[i]);

  var allDone = D.every(function(_,j){ return (S.c[j]||0) >= (S.g[j]||D[j].g); });
  E.dy.classList.toggle('show', allDone);

  // Update Dots Efficiently
  var dots = E.dots.children;
  for(var j=0; j<dots.length; j++) {
    dots[j].className = (j === i) ? 'on' : '';
    dots[j].setAttribute('aria-selected', j === i ? 'true' : 'false');
  }

  if(c>0){
    E.hint.style.opacity = '0';
    E.ct.classList.remove('invite');
    E.hint.textContent = 'tap anywhere';
  }else{
    E.hint.style.opacity = '';
    if(!anyToday){
      E.ct.classList.add('invite');
      E.hint.textContent = 'tap to begin';
    }else{
      E.ct.classList.remove('invite');
      E.hint.textContent = 'tap anywhere';
    }
  }
}

var ax = null;
function ga(){
  if(!ax) ax = new (window.AudioContext || window.webkitAudioContext)();
  if(ax.state==='suspended') ax.resume();
  return ax;
}

function sndTap(){
  if(!S.snd) return;
  try{
    var x = ga(), t = x.currentTime;
    var o1 = x.createOscillator(), g1 = x.createGain();
    o1.connect(g1); g1.connect(x.destination);
    o1.type='triangle'; o1.frequency.value=900;
    g1.gain.setValueAtTime(0.025,t);
    g1.gain.exponentialRampToValueAtTime(0.001,t+0.035);
    o1.start(t); o1.stop(t+0.035);
  }catch(e){}
}

function sndWood(){
  if(!S.snd) return;
  try{
    var x = ga(), t = x.currentTime;
    var osc = x.createOscillator(), gain = x.createGain();
    osc.connect(gain); gain.connect(x.destination);
    osc.frequency.setValueAtTime(600, t);
    osc.frequency.exponentialRampToValueAtTime(100, t+0.05);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(1.5, t+0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    osc.start(t); osc.stop(t+0.05);
  }catch(e){}
}

function sndMilestone(){
  if(!S.snd) return;
  try{
    var x = ga(), t = x.currentTime;
    var o = x.createOscillator(), g = x.createGain();
    o.connect(g); g.connect(x.destination);
    o.type='sine'; o.frequency.value=1047;
    g.gain.setValueAtTime(0.02,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    o.start(t); o.stop(t+0.25);
  }catch(e){}
}

function sndComplete(){
  if(!S.snd) return;
  try{
    var x = ga(), t = x.currentTime;
    [523.25,659.25,783.99,1046.5].forEach(function(f,i){
      var o = x.createOscillator(), g = x.createGain();
      o.connect(g); g.connect(x.destination);
      o.type='sine'; o.frequency.value=f;
      var st = t+i*0.1;
      g.gain.setValueAtTime(0.02,st);
      g.gain.exponentialRampToValueAtTime(0.001,st+0.4);
      o.start(st); o.stop(st+0.4);
    });
  }catch(e){}
}

var ssLastTap = 0, ssUIInt = null;

function ssTap() {
  var now = Date.now();
  var addedSec = 0;
  if (ssLastTap > 0) {
    var diff = now - ssLastTap;
    if (diff < CONFIG.SESSION_MS) { 
      addedSec = Math.round(diff / 1000);
    }
  }
  ssLastTap = now;
  
  if(addedSec > 0) {
    S.tToday = (S.tToday || 0) + addedSec;
    var tk = getDayKey();
    S.ht[tk] = (S.ht[tk] || 0) + addedSec;
  }

  E.ss.classList.add('active');
  ssUpdateUI();
  
  if (ssUIInt) clearTimeout(ssUIInt);
  ssUIInt = setTimeout(function() {
    E.ss.classList.remove('active');
  }, 3000);
}

function ssUpdateUI() {
  var totalSec = S.tToday || 0;
  E.ss.textContent = totalSec === 0 ? '' : fmtTime(totalSec);
}

function ssReset() {
  ssLastTap = 0;
  if (ssUIInt) { clearTimeout(ssUIInt); ssUIInt = null; }
  E.ss.classList.remove('active');
  ssUpdateUI();
}

/* POOLED RIPPLES FOR MEMORY EFFICIENCY */
var ripplePool = [];
function ripple(x,y){
  var r;
  if(ripplePool.length > 0) r = ripplePool.pop();
  else { r = document.createElement('div'); r.className = 'rip'; }
  
  r.style.cssText = 'left:'+(x-50)+'px;top:'+(y-50)+'px;width:100px;height:100px';
  document.body.appendChild(r);
  setTimeout(function(){
    r.remove();
    if(ripplePool.length < CONFIG.MAX_RIPPLES) ripplePool.push(r);
  }, 700);
}

    }, CONFIG.LONG_PRESS_MS);
  }

  zenReset();

  S.c[i]++;
  S.lt[i]++;
  var tk = getDayKey();
  if(!S.h[tk]) S.h[tk] = {};
  S.h[tk][i] = (S.h[tk][i] || 0) + 1;

  var pct = S.c[i]/g;
  var msNow = Math.min(Math.floor(pct*4), 3);
  if(msNow > (S.ms[i]||0)){
    S.ms[i] = msNow;
    vb([25,40,25]);
    sndMilestone();
  }

  save();
  requestAnimationFrame(function(){
    render();
    pulse();
    ripple(e.clientX, e.clientY);
  });
  
  vb([30]);
  if(S.wood) sndWood(); else sndTap();

  if(S.c[i] === g && !goalHit[i]){

    flash(); glowBurst();
    vb([30,50,30,50,30,50,50]);
    sndComplete();
  }
});

$('impF').onchange = function(){
  var f = this.files[0];
  if(!f || f.size > 1e6){ this.value=''; return; }
  var r = new FileReader();
  r.onload = function(e){
    try{
      var d = JSON.parse(e.target.result);
      if(!d || typeof d !== 'object' || !d.c || !d.g) throw 'invalid';
      
      D.forEach(function(_,i){
        d.c[i] = Math.max(0, parseInt(d.c[i])||0);
        d.g[i] = Math.max(1, parseInt(d.g[i])||D[i].g);
        if(!d.lt) d.lt={}; d.lt[i] = Math.max(0, parseInt(d.lt[i])||0);
        if(!d.ms) d.ms={}; d.ms[i] = Math.max(0, Math.min(parseInt(d.ms[i])||0, 3));
